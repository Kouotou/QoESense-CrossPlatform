name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  dart:
    name: Format, analyze, codegen, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting (hand-written code; *.g.dart keeps Pigeon's own formatting)
        run: git ls-files '*.dart' | grep -v '\.g\.dart$' | xargs dart format --output=none --set-exit-if-changed
      - name: Generated files are up to date (Pigeon channel + l10n)
        run: |
          dart run pigeon --input pigeons/telemetry_api.dart
          flutter gen-l10n
          git diff --exit-code -- lib/src/platform android/app/src/main/kotlin ios/Runner lib/l10n/generated
      - run: flutter analyze
      - run: flutter test --coverage

  android:
    name: Android debug build (compiles Kotlin)
    runs-on: ubuntu-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug

  ios:
    # Compiles the Swift side without signing - catches Swift errors without the borrowed Mac.
    # macOS minutes count 10x against a private repo's free allowance.
    name: iOS build, no codesign (compiles Swift)
    runs-on: macos-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
