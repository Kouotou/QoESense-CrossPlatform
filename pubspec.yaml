name: qoesense
description: "QoESense cross-platform QoE telemetry collector (MSc research)."
publish_to: 'none'

# 2.0.0 so this project's appVersion can never collide with the reference Android app's 1.x
# values in BigQuery's appVersion column.
version: 2.0.0+1

environment:
  sdk: ^3.13.7

# See docs/DEPENDENCIES.md for why each package is here and what Phase 2+ will add.
dependencies:
  cloud_firestore: ^7.1.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.1
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
