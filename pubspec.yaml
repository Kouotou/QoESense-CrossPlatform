name: qoesense
description: "QoESense cross-platform QoE telemetry collector (MSc research)."
publish_to: 'none'

# 2.0.0 so this project's appVersion can never collide with the reference Android app's 1.x
# values in BigQuery's appVersion column.
version: 2.0.0+1

environment:
  sdk: ^3.13.7

# See docs/DEPENDENCIES.md for why each package is here and what Phase 2+ will add.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.1.1

flutter:
  uses-material-design: true
  generate: true
